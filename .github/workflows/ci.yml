name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (shellcheck, jq, zstd, restic)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq zstd
          # Pin restic to match the version the tool is developed against.
          RESTIC_VER=0.18.0
          curl -fsSL -o /tmp/restic.bz2 \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VER}/restic_${RESTIC_VER}_linux_amd64.bz2"
          bunzip2 /tmp/restic.bz2
          sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          restic version

      - name: ShellCheck
        run: shellcheck --severity=warning -x pbo install.sh lib/*.sh tests/*.sh tests/mocks/*

      - name: Syntax check
        run: for f in pbo install.sh lib/*.sh; do bash -n "$f"; done

      - name: Tests
        run: bash tests/all.sh
